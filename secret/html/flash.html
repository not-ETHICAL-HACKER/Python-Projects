<!DOCTYPE html>
<html>
<head>
    <title>Flashing Page</title>
    <script>
        let flashInterval = null;

        function startFlashing() {
            if (flashInterval !== null) return; // prevent multiple intervals
            flashInterval = setInterval(() => {
                document.body.style.backgroundColor =
                    `hsl(${Math.random() * 360}, 100%, 50%)`;
            }, 0); // 500ms
        }

        function stopFlashing() {
            clearInterval(flashInterval);
            flashInterval = null;
            document.body.style.backgroundColor = "white";
        }
    </script>
</head>
<body onload="startFlashing()">
    <h1>Welcome to the Flashing Page!</h1>
    <p>This page changes its background color every half second.</p>
    <button onclick="stopFlashing()">Stop Flashing</button>
    <button onclick="startFlashing()">Start Flashing</button>
</body>
</html>
